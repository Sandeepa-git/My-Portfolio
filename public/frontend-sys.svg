<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(16, 185, 129, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#fe-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Visual -->
  <g transform="translate(100, 100)" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Grid of components / Modular Design -->
    <rect x="2" y="2" width="16" height="12" rx="2" stroke-width="2" />
    <rect x="22" y="2" width="16" height="12" rx="2" stroke-width="2" />
    <rect x="2" y="18" width="36" height="10" rx="2" stroke-width="2" />
  </g>
  
  <text x="100" y="320" fill="#10B981" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="1" text-transform="uppercase">System Design</text>
  <text x="100" y="375" fill="white" font-family="system-ui, sans-serif" font-size="36" font-weight="800" letter-spacing="-1">Front-End System Design</text>
  <text x="100" y="420" fill="rgba(255, 255, 255, 0.6)" font-family="system-ui, sans-serif" font-size="18" font-weight="500">Building scalable, high-performance user interfaces</text>
</svg>
